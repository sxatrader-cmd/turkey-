<style>
/* Layout: the B2B email look — cream ground, centred letter card, navy masthead + gold rule, serif headings, letter-spaced gold eyebrows */
:root{
  --navy:#1B2A47; --navy-2:#2A3C5F;
  --gold:#B8955A; --gold-2:#D9C08E;
  --ground:#EEE6D8; --paper:#FCFAF6; --panel:#F4EEE3;
  --ink:#22262E; --muted:#5F6672; --line:#E6DDCC;
  --serif-en:"Libre Baskerville", "PT Serif", Georgia, "Times New Roman", serif;
  --serif-ar:"Amiri", "Traditional Arabic", Georgia, serif;
  --sans-en:"Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --sans-ar:"IBM Plex Sans Arabic", Tahoma, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans-ar);font-size:16.5px;line-height:1.85;-webkit-font-smoothing:antialiased;
  padding:24px max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
html:not([lang="ar"]) body{font-family:var(--sans-en);line-height:1.7}
img{max-width:100%;display:block}
.disp{font-family:var(--serif-ar);font-weight:700}
html:not([lang="ar"]) .disp{font-family:var(--serif-en);font-weight:400}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--navy-2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{max-width:880px;margin:0 auto;background:var(--paper);border-radius:6px;overflow:hidden;box-shadow:0 2px 24px -12px rgba(27,42,71,.35)}
.wrap,.in{padding-left:clamp(18px,5vw,44px);padding-right:clamp(18px,5vw,44px)}
.eyebrow{display:block;font:500 13px var(--sans-en);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
html[lang="ar"] .eyebrow{font-family:var(--sans-ar);letter-spacing:.02em;font-size:14px}

/* masthead */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.logo{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none}
.logo svg{width:58px;height:58px;flex:none;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--gold)}
.logo b{font-family:var(--serif-en);font-size:22px;letter-spacing:.16em;font-weight:700;color:#EFE3C8;text-transform:uppercase;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:16px}
.tagline{font:500 11px/1.5 var(--sans-en);letter-spacing:.18em;text-transform:uppercase;color:#D8D3C6;text-align:end}
html[lang="ar"] .tagline{font-family:var(--sans-ar);letter-spacing:0;font-size:12px}
.lang{display:flex;align-items:center;gap:6px;border:1px solid rgba(217,192,142,.5);border-radius:4px;padding:0 4px 0 8px;color:#EFE3C8}
.lang select{background:transparent;color:#EFE3C8;border:0;font:600 13px var(--sans-en);padding:7px 4px;cursor:pointer;max-width:110px}
.lang select option{color:#1B2A47;background:#fff}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.lang button{background:none;border:0;color:#EFE3C8;padding:6px 12px;font:600 12px var(--sans-en);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--navy)}

/* hero */
.hero-img{height:clamp(220px,42vw,380px);background:var(--navy-2) center/cover no-repeat}
.hero-band{background:var(--navy);color:#fff;border-bottom:5px solid var(--gold);padding-block:32px 34px}
.hero-band h1{font-size:clamp(30px,5.2vw,44px);line-height:1.25;margin:10px 0 12px;color:#fff}
.hero-band p{margin:0;color:#D9DEE6;max-width:62ch;font-size:16px}

/* body */
.letter{padding-block:34px 6px;max-width:68ch;font-size:17px}
.letter p{margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--panel);border-radius:6px;padding:20px 10px;text-align:center;margin-block:18px 8px}
.stat{min-width:0}
.stat strong{display:block;font-family:var(--serif-en);font-size:28px;color:var(--navy);font-weight:400;line-height:1.3}
html[lang="ar"] .stat strong{font-family:var(--serif-ar);font-weight:700}
.stat span{display:block;font-size:13px;color:var(--muted);line-height:1.45}

section.block{padding-block:34px}
.sec-head{margin-bottom:20px}
.sec-head h2{font-size:clamp(24px,3.8vw,32px);color:var(--navy);margin-top:6px;line-height:1.3}
.sec-head p{margin:8px 0 0;color:var(--muted);max-width:62ch;font-size:15px}

/* departures */
.dep{background:var(--panel);border-radius:6px;padding:20px;display:grid;grid-template-columns:1fr 1.6fr;gap:18px;align-items:center}
.dep h3{font-family:var(--serif-en);font-weight:400;font-size:19px;color:var(--navy)}
html[lang="ar"] .dep h3{font-family:var(--serif-ar);font-weight:700;font-size:21px}
.dep p{margin:4px 0 0;color:var(--muted);font-size:14px}
.dates{display:flex;flex-wrap:wrap;gap:8px}
.date{border:1px solid var(--line);border-radius:4px;padding:6px 10px;text-align:center;background:var(--paper);font-variant-numeric:tabular-nums;min-width:66px}
.date b{display:block;font-family:var(--serif-en);font-weight:400;font-size:22px;color:var(--navy);line-height:1.15}
.date small{font-size:11.5px;color:var(--muted)}

/* days */
.days{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.day{border-bottom:1px solid var(--line)}
.day-btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 4px}
.day-btn:hover .day-title h3{color:var(--navy-2)}
.day-btn:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.daynum{width:62px;height:62px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;text-align:center;line-height:1;box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--gold)}
.daynum small{display:block;font:500 9.5px var(--sans-en);letter-spacing:.16em;color:var(--gold-2);text-transform:uppercase;margin-bottom:2px}
html[lang="ar"] .daynum small{letter-spacing:0;font-family:var(--sans-ar);font-size:11px}
.daynum b{font-family:var(--serif-en);font-size:24px;font-weight:400}
.day-title{min-width:0}
.day-title .city{display:block;font:500 12px var(--sans-en);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
html[lang="ar"] .day-title .city{font-family:var(--sans-ar);letter-spacing:0;font-size:13px}
.day-title h3{font-family:var(--serif-en);font-weight:400;font-size:21px;color:var(--navy);line-height:1.35;margin-top:2px}
html[lang="ar"] .day-title h3{font-family:var(--serif-ar);font-weight:700;font-size:23px}
.day-title .stops-line{display:block;font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.chev{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);transition:transform .25s}
.day.open .chev{transform:rotate(180deg);background:var(--gold);color:#fff}
.day-body{padding:0 4px 26px}
.day-body .text{max-width:68ch;margin:4px 0 6px;font-size:16.5px}
.day-body .text p{margin:0 0 13px}
.night{display:inline-flex;gap:8px;align-items:center;background:var(--panel);color:var(--navy);border-radius:4px;padding:6px 14px;font-size:14px;font-weight:600;margin:4px 0 18px;border-inline-start:3px solid var(--gold)}
.hotel{margin:22px 0 6px;border:0;border-radius:6px;overflow:hidden;background:var(--paper)}
.hotel-h{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--gold)}
.hotel-h .eyebrow{font-size:11px}
.hotel-h h4{margin:2px 0 0;font-family:var(--serif-en);font-weight:400;font-size:20px;color:#fff;line-height:1.3}
html[lang="ar"] .hotel-h h4{font-family:var(--serif-en)}
.stars{color:var(--gold-2);font-size:15px;letter-spacing:2px;white-space:nowrap}
.stars .stxt{letter-spacing:0;font-weight:600;font-size:13px;color:#EFE3C8;margin-inline-start:4px}
.stbadge{display:inline-block;vertical-align:middle;font:600 12px var(--sans-en);background:var(--gold);color:var(--navy);border-radius:3px;padding:2px 7px;margin-inline-start:6px;letter-spacing:0}
.hotel-b{padding:14px 18px 18px}
.hotel-b ul{margin:0 0 14px;padding-inline-start:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;font-size:14.5px;color:var(--ink)}
.hotel-b li::marker{color:var(--gold)}
.hgal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hgal .ph{aspect-ratio:1/1}
.hgal-empty{font-size:13px;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ph{all:unset;box-sizing:border-box;cursor:zoom-in;display:block;border-radius:4px;overflow:hidden;background:var(--navy);position:relative;aspect-ratio:4/3;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ph:hover img{transform:scale(1.05)}
.ph .cap{position:absolute;inset:auto 0 0 0;padding:24px 10px 8px;background:linear-gradient(transparent,rgba(27,42,71,.92));color:#fff;font-size:13px;font-weight:600;line-height:1.3}
.ph.loading{background:linear-gradient(110deg,#ebe4d6 30%,#f6f1e8 50%,#ebe4d6 70%);background-size:200% 100%;animation:sh 1.3s infinite}
.ph.noimg{cursor:default;background:linear-gradient(135deg,var(--navy),var(--navy-2))}
@keyframes sh{to{background-position:-200% 0}}

/* included */
.incl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.incl div{background:var(--panel);border-radius:6px;padding:18px;min-width:0;border-top:3px solid var(--gold)}
.incl h4{margin:0 0 6px;color:var(--navy);font-family:var(--serif-en);font-weight:400;font-size:17px}
html[lang="ar"] .incl h4{font-family:var(--serif-ar);font-weight:700;font-size:19px}
.incl p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}

/* fees */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px;background:var(--paper)}
th,td{padding:12px 16px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--navy);color:#EFE3C8;font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
html[lang="ar"] th{letter-spacing:0;font-size:13.5px}
tbody tr:nth-child(even) td{background:var(--panel)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;color:var(--navy)}
td.st-included{color:#2E7D4F}td.st-not{color:#A04A3A}td.st-optional{color:var(--gold)}
td .d{font-size:12px;color:var(--gold);font-weight:600;white-space:nowrap}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* form */
.formcard{background:var(--navy);color:#fff;border-radius:6px;padding:30px;display:grid;grid-template-columns:1fr 1.15fr;gap:28px;border-bottom:5px solid var(--gold)}
.formcard h2{font-size:clamp(24px,3.8vw,32px);color:#fff;margin-top:6px;line-height:1.3}
.formcard p{color:#D3D9E2;margin:10px 0 0;font-size:15px}
form{display:grid;gap:12px;min-width:0}
label{font-size:12px;color:var(--gold-2);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
html[lang="ar"] label{letter-spacing:0;font-size:13.5px}
input{width:100%;padding:12px 14px;border-radius:4px;border:1px solid rgba(217,192,142,.35);background:rgba(255,255,255,.06);color:#fff;font-size:16px;font-family:inherit}
input::placeholder{color:#93A0B4}
input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.field{display:grid;gap:4px}
.btn{background:var(--gold);color:var(--navy);border:0;border-radius:4px;padding:14px;font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:inherit}
html[lang="ar"] .btn{letter-spacing:0;font-size:16px}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.6;cursor:wait}
.msg{font-size:14px;min-height:1.4em}
.msg.ok{color:#A9E2C3}.msg.err{color:#FFB8AC}
.hp{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;clip-path:inset(50%)}

footer{background:var(--navy);color:#C9CFD9;font-size:14px;border-top:5px solid var(--gold);margin-top:34px}
footer .wrap{padding-block:24px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
footer a{color:var(--gold-2);text-decoration:none}
footer .logo svg{width:40px;height:40px}
footer .logo b{font-size:16px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(18,26,43,.94);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-frame{position:relative;background:var(--paper);padding:16px 16px 0;border-radius:4px;max-width:min(1100px,100%);box-shadow:0 30px 80px rgba(0,0,0,.6);border-top:5px solid var(--gold)}
.lb-frame::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold-2);border-radius:2px;pointer-events:none}
.lb-img{max-height:70vh;width:auto;margin:0 auto}
.lb-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 6px 14px;background:var(--paper)}
.lb-foot .logo{color:var(--navy)}
.lb-foot .logo svg{width:44px;height:44px}
.lb-foot .logo b{color:var(--navy);font-size:16px}
.lb-cap{font-family:var(--serif-en);color:var(--navy);font-size:15px;text-align:end;min-width:0}
html[lang="ar"] .lb-cap{font-family:var(--serif-ar);font-size:17px;font-weight:700}
.lb-cap small{display:block;font:400 11px var(--sans-en);color:var(--muted)}
.lb-close,.lb-nav{position:absolute;background:var(--gold);color:var(--navy);border:0;width:42px;height:42px;border-radius:50%;font-size:22px;cursor:pointer;display:grid;place-items:center;font-weight:700}
.lb-close{top:-18px;inset-inline-end:-16px}
.lb-nav{top:calc(50% - 40px)}
.lb-prev{inset-inline-start:-18px}.lb-next{inset-inline-end:-18px}
.lb-watermark{position:absolute;top:28px;inset-inline-start:28px;pointer-events:none}
.lb-watermark svg{width:70px;height:70px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--gold),0 4px 14px rgba(0,0,0,.45)}

@media (max-width:760px){
  body{padding-block:0}
  .card{border-radius:0}
  .topbar .wrap{padding-block:12px}
  .logo svg{width:44px;height:44px}
  .logo b{font-size:16px;letter-spacing:.12em}
  .tagline{display:none}
  .stats{grid-template-columns:repeat(2,1fr);row-gap:16px}
  .dep,.formcard{grid-template-columns:1fr}
  .incl{grid-template-columns:1fr}
  .day-btn{gap:12px;padding:16px 0}
  .daynum{width:50px;height:50px}
  .daynum b{font-size:20px}
  .day-title h3{font-size:18px}
  html[lang="ar"] .day-title h3{font-size:20px}
  .gallery{grid-template-columns:repeat(2,1fr)}
  .hgal{grid-template-columns:repeat(4,1fr);gap:5px}
  .hotel-b ul{grid-template-columns:1fr}
  table{min-width:0;font-size:14px}
  th,td{padding:10px 10px}
  td.num{white-space:normal}
  .lb-nav{top:auto;bottom:-58px}
  .lb-prev{inset-inline-start:calc(50% - 50px)}.lb-next{inset-inline-end:calc(50% - 50px)}
  .lb-close{top:-16px;inset-inline-end:-6px}
  .lb-watermark svg{width:48px;height:48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<noscript><div style="max-width:880px;margin:0 auto;background:#FCFAF6;padding:24px">
<h1>رحلة تركيا 11 يوماً تبدأ كل جمعة من إسطنبول</h1>
<p>برنامج سياحي للمسافرين من أي دولة، مع فنادق 5 نجوم ومرشد خاص. Turkey 11-day tour from Istanbul, available in Arabic, English, Russian, German, French and Spanish.</p>
<ol><li><strong>مطار إسطنبول ← فلوريا / Istanbul Airport → Florya</strong>: Welcome at Istanbul Airport · Istanbul Aquarium, Florya · Sea of Marmara at sunset</li><li><strong>إسطنبول / Istanbul</strong>: Ortaköy and the Bosphorus · Colourful Balat · Eyüp Sultan Mosque · Cable car to Pierre Loti Café · Isfanbul theme park (Vialand)</li><li><strong>جزر الأميرات / Princes' Islands</strong>: Cruise to the islands · Büyükada (the Grand Island) · Old wooden mansions · Lunch on the island</li><li><strong>شيلي وآغفا / Şile & Ağva</strong>: Göksu River, Ağva · Boat tour on the Hidden Lake · Şile Lighthouse · Şile beach on the Black Sea</li><li><strong>إسطنبول / Istanbul</strong>: Two-hour Bosphorus cruise · Dolmabahçe Palace · Çamlıca Hill · Shopping at İstinyePark</li><li><strong>صبنجة وماشوكية / Sapanca & Maşukiye</strong>: Lake Sapanca · Maşukiye village and waterfalls · ATV ride · Mount Kartepe</li><li><strong>ماشوكية ← إزميت ← إسطنبول / Maşukiye → İzmit → Istanbul</strong>: Mountain reserve and horse riding · İzmit forest viewpoint · Local honey and nuts · Viaport Aquarium and Lion Park</li><li><strong>بورصة / Bursa</strong>: Uludağ cable car · The 600-year-old plane tree · Historic silk market · Turkish delight and sweets</li><li><strong>يالوفا / Yalova</strong>: Ferry across the Sea of Marmara · Yalova waterfalls · Termal thermal park · Thermal sulphur baths</li><li><strong>سوغوت ← إسكي شهير / Söğüt → Eskişehir</strong>: Ertuğrul Gazi's tomb, Söğüt · Colourful houses of Odunpazarı · Porsuk River boat ride · Sazova Park and its fairy-tale castle · Wax Museum</li><li><strong>إسطنبول ← المطار / Istanbul → Airport</strong>: Free time in Istanbul · Transfer to Istanbul Airport</li></ol>
<p>Fable Tour · support@fabletour.com · +964 771 174 5353</p></div></noscript>

"ar": "<p>أهلاً بك في إسطنبول. يبدأ البرنامج كل يوم جمعة بوصولك إلى مطار إسطنبول، أياً كانت الدولة التي تسافر منها. يستقبلك مندوب Fable Tour في صالة الوصول ويرافقك بسيارة خاصة مكيّفة إلى فندقك ذي الخمس نجوم، لترتاح قليلاً بعد الرحلة.</p><p>بعد الظهر، وحسب موعد وصولك، نتوجه إلى أكواريوم إسطنبول في فلوريا على شاطئ بحر مرمرة، أحد أكبر أحواض الأحياء المائية في العالم، حيث تمشي داخل نفق زجاجي تسبح فوقه أسماك القرش والسلاحف وآلاف الكائنات البحرية. نختم اليوم بنزهة قصيرة على الساحل وقت الغروب، ثم العودة إلى الفندق.</p>",
"en": "<p>Welcome to Istanbul. The program starts every Friday when you land at Istanbul Airport, whichever country you are flying from. A Fable Tour representative meets you in the arrivals hall and takes you by private air-conditioned car to your 5-star hotel, so you can rest after the flight.</p><p>In the afternoon, depending on your arrival time, we head to the Istanbul Aquarium in Florya on the shore of the Sea of Marmara, one of the largest aquariums in the world. You walk through glass tunnels while sharks, turtles and thousands of sea creatures swim over your head. We end the day with a short walk along the coast at sunset before returning to the hotel.</p>",
"ru": "<p>Добро пожаловать в Стамбул! Программа начинается каждую пятницу с вашего прилёта в аэропорт Стамбула — из любой страны. Представитель Fable Tour встречает вас в зале прилёта и на личном автомобиле с кондиционером отвозит в отель 5 звёзд, чтобы вы могли отдохнуть после перелёта.</p><p>Днём, в зависимости от времени прилёта, мы едем в Стамбульский аквариум во Флорье на берегу Мраморного моря — один из крупнейших аквариумов мира. Вы проходите по стеклянным туннелям, над которыми плавают акулы, черепахи и тысячи морских обитателей. Вечером — короткая прогулка по набережной на закате и возвращение в отель.</p>",
"de": "<p>Willkommen in Istanbul! Das Programm beginnt jeden Freitag mit Ihrer Ankunft am Flughafen Istanbul – ganz gleich, aus welchem Land Sie anreisen. Ein Vertreter von Fable Tour empfängt Sie in der Ankunftshalle und bringt Sie im privaten, klimatisierten Wagen in Ihr 5-Sterne-Hotel.</p><p>Am Nachmittag besuchen wir je nach Ankunftszeit das Istanbul Aquarium in Florya am Marmarameer, eines der größten Aquarien der Welt. Durch gläserne Tunnel gehen Sie unter Haien, Schildkröten und Tausenden Meerestieren hindurch. Zum Abschluss ein kurzer Spaziergang an der Küste bei Sonnenuntergang.</p>",
"fr": "<p>Bienvenue à Istanbul ! Le programme commence chaque vendredi à votre arrivée à l'aéroport d'Istanbul, quel que soit le pays d'où vous venez. Un représentant de Fable Tour vous accueille dans le hall d'arrivée et vous conduit en voiture privée climatisée à votre hôtel 5 étoiles.</p><p>L'après-midi, selon votre heure d'arrivée, nous visitons l'Aquarium d'Istanbul à Florya, au bord de la mer de Marmara, l'un des plus grands aquariums du monde. Vous marchez dans des tunnels de verre sous les requins, les tortues et des milliers d'espèces marines. Petite promenade sur la côte au coucher du soleil, puis retour à l'hôtel.</p>",
"es": "<p>¡Bienvenido a Estambul! El programa comienza cada viernes con su llegada al aeropuerto de Estambul, desde cualquier país. Un representante de Fable Tour le recibe en la sala de llegadas y le lleva en coche privado con aire acondicionado a su hotel de 5 estrellas.</p><p>Por la tarde, según su hora de llegada, visitamos el Acuario de Estambul en Florya, a orillas del mar de Mármara, uno de los acuarios más grandes del mundo. Caminará por túneles de cristal bajo tiburones, tortugas y miles de especies marinas. Terminamos con un breve paseo por la costa al atardecer.</p>"

"ar": "<p>بعد الإفطار نبدأ جولة معالم إسطنبول من أورتاكوي، القرية الصغيرة على ضفة البوسفور بجامعها الأبيض الأنيق تحت الجسر المعلّق، مع وقت للمقاهي والمحلات الصغيرة. ثم ننتقل إلى حي بلاط ببيوته الخشبية الملوّنة وأزقته المرصوفة التي تحكي تاريخ إسطنبول القديمة.</p><p>نزور بعدها جامع أيوب سلطان، من أكثر الأماكن احتراماً في المدينة، ونصعد بالتلفريك إلى مقهى بيير لوتي لنشرب الشاي التركي فوق إطلالة بانورامية على القرن الذهبي. وبعد الظهر ننتقل إلى إيسفانبول (فيالاند سابقاً) القريبة، إحدى أكبر مدن الألعاب في تركيا، مع تذكرة دخول غير محدودة لكل الألعاب، ويمكن لمن يفضّل التسوق قضاء الوقت في مول فينيسيا المجاور.</p>",
"en": "<p>After breakfast our landmarks tour begins in Ortaköy, a small Bosphorus village with an elegant white mosque beneath the suspension bridge, with time for its cafés and little shops. We continue to Balat, with its colourful wooden houses and cobbled lanes that tell the story of old Istanbul.</p><p>Next is Eyüp Sultan Mosque, one of the most revered places in the city, and a cable car ride up to Pierre Loti Café for Turkish tea above a panoramic view of the Golden Horn. In the afternoon we move to nearby Isfanbul (formerly Vialand), one of the largest theme parks in Turkey, with an unlimited-rides ticket; if you prefer shopping, you can spend the time at the neighbouring Venezia Mall instead.</p>",
"ru": "<p>После завтрака начинаем обзорную экскурсию с Ортакёя — небольшой деревни на берегу Босфора с изящной белой мечетью под подвесным мостом, кафе и маленькими лавками. Затем — квартал Балат с яркими деревянными домами и мощёными улочками старого Стамбула.</p><p>Далее мечеть Эюп Султан, одно из самых почитаемых мест города, и подъём на канатной дороге к кафе Пьер Лоти — турецкий чай с панорамой Золотого Рога. Во второй половине дня едем в соседний Isfanbul (бывший Vialand), один из крупнейших парков развлечений Турции, с безлимитным билетом на все аттракционы; любители шопинга могут провести время в соседнем ТЦ Venezia.</p>",
"de": "<p>Nach dem Frühstück beginnt unsere Tour in Ortaköy, einem kleinen Dorf am Bosporus mit eleganter weißer Moschee unter der Hängebrücke, Cafés und kleinen Läden. Weiter geht es nach Balat mit bunten Holzhäusern und Kopfsteingassen des alten Istanbul.</p><p>Danach besuchen wir die Eyüp-Sultan-Moschee, einen der meistverehrten Orte der Stadt, und fahren mit der Seilbahn zum Café Pierre Loti – türkischer Tee mit Panoramablick auf das Goldene Horn. Am Nachmittag geht es in den nahen Freizeitpark Isfanbul (früher Vialand) mit Ticket für alle Fahrgeschäfte; wer lieber einkauft, verbringt die Zeit in der benachbarten Venezia Mall.</p>",
"fr": "<p>Après le petit-déjeuner, la visite commence à Ortaköy, petit village au bord du Bosphore avec son élégante mosquée blanche sous le pont suspendu, ses cafés et ses boutiques. Nous continuons vers Balat, ses maisons en bois colorées et ses ruelles pavées du vieil Istanbul.</p><p>Puis la mosquée d'Eyüp Sultan, l'un des lieux les plus vénérés de la ville, et le téléphérique jusqu'au café Pierre Loti pour un thé turc face au panorama de la Corne d'Or. L'après-midi, direction le parc Isfanbul (ex-Vialand), l'un des plus grands parcs d'attractions de Turquie, avec accès illimité aux manèges ; les amateurs de shopping peuvent profiter du centre Venezia voisin.</p>",
"es": "<p>Tras el desayuno, el recorrido empieza en Ortaköy, un pequeño pueblo junto al Bósforo con su elegante mezquita blanca bajo el puente colgante, cafés y tiendas. Seguimos hacia Balat, con sus casas de madera de colores y calles empedradas del viejo Estambul.</p><p>Después, la mezquita de Eyüp Sultan, uno de los lugares más venerados de la ciudad, y el teleférico hasta el café Pierre Loti para tomar té turco con vistas al Cuerno de Oro. Por la tarde vamos al cercano parque Isfanbul (antes Vialand), uno de los mayores parques temáticos de Turquía, con acceso ilimitado a las atracciones; quien prefiera compras puede pasar el tiempo en el vecino centro Venezia.</p>"

"ar": "<p>ننطلق في العاشرة صباحاً من الفندق إلى الميناء ونصعد إلى السفينة في رحلة بحرية جميلة عبر بحر مرمرة نحو جزر الأميرات، حيث لا توجد سيارات تقليدية والتنقل كله بالدراجات والعربات الكهربائية الصديقة للبيئة. نستمتع بنسيم البحر وبمرور الجزر الصغيرة واحدة بعد الأخرى.</p><p>نتوقف في بيوك أدا، كبرى الجزر، لنتجول بين قصورها الخشبية العثمانية القديمة وحدائقها المزهرة وشوارعها الهادئة المطلّة على البحر، ونتناول الغداء في أحد مطاعم الجزيرة. في المساء نعود بالسفينة مستمتعين بمناظر الساحل، ثم التوصيل إلى الفندق حوالي السابعة والنصف.</p>",
"en": "<p>At 10:00 we leave the hotel for the pier and board a scenic cruise across the Sea of Marmara to the Princes' Islands, where there are no ordinary cars and people get around by bicycle and eco-friendly electric carts. Enjoy the sea breeze as the small islands pass by one after another.</p><p>We stop at Büyükada, the largest island, to wander among old Ottoman wooden mansions, flowering gardens and quiet streets overlooking the sea, and have lunch at a local restaurant. In the evening we sail back past the coastline, with drop-off at your hotel around 19:30.</p>",
"ru": "<p>В 10:00 выезжаем из отеля к причалу и отправляемся в морскую прогулку по Мраморному морю к Принцевым островам, где нет обычных автомобилей — только велосипеды и экологичные электрокары. Морской бриз и острова, сменяющие друг друга.</p><p>Остановка на Бююкаде, самом большом острове: старинные османские деревянные особняки, цветущие сады и тихие улочки у моря, обед в местном ресторане. Вечером возвращаемся вдоль побережья; трансфер в отель около 19:30.</p>",
"de": "<p>Um 10:00 Uhr fahren wir zum Hafen und unternehmen eine Bootsfahrt über das Marmarameer zu den Prinzeninseln, auf denen es keine gewöhnlichen Autos gibt – man bewegt sich mit Fahrrad und umweltfreundlichen Elektrowagen.</p><p>Auf Büyükada, der größten Insel, spazieren wir zwischen alten osmanischen Holzvillen, blühenden Gärten und ruhigen Straßen am Meer und essen in einem lokalen Restaurant zu Mittag. Am Abend Rückfahrt entlang der Küste, Ankunft im Hotel gegen 19:30 Uhr.</p>",
"fr": "<p>À 10 h, départ de l'hôtel vers l'embarcadère pour une belle croisière sur la mer de Marmara jusqu'aux îles des Princes, où l'on circule sans voitures ordinaires, à vélo ou en voiturette électrique.</p><p>Escale à Büyükada, la plus grande île : anciennes demeures ottomanes en bois, jardins fleuris et rues paisibles face à la mer, et déjeuner dans un restaurant local. Retour en bateau le long de la côte, arrivée à l'hôtel vers 19 h 30.</p>",
"es": "<p>A las 10:00 salimos hacia el muelle para un bonito crucero por el mar de Mármara hasta las islas de los Príncipes, donde no circulan coches convencionales: todo se recorre en bicicleta o en vehículos eléctricos.</p><p>Paramos en Büyükada, la isla más grande, para pasear entre antiguas mansiones otomanas de madera, jardines en flor y calles tranquilas frente al mar, y almorzamos en un restaurante local. Regreso en barco por la costa, llegada al hotel hacia las 19:30.</p>"
},

"ar": "<p>يستقبلك المرشد في الفندق صباحاً لننطلق شمالاً نحو ساحل البحر الأسود. نبدأ بقرية آغفا التي تجمع بين الغابات الكثيفة والنهرين اللذين يلتقيان بالبحر، ونتوقف عند البحيرة المخفية في جولة بالقارب وسط الطبيعة الهادئة، ثم نمر بنهر كوكسو بمياهه الصافية (السباحة متاحة في موسم الصيف).</p><p>بعد الغداء في مطعم محلي نتوجه إلى شيلي لنزور منارتها التاريخية المطلّة على البحر الأسود، ونستريح على أحد أجمل شواطئها. في المساء نعود إلى إسطنبول ونصل إلى الفندق حوالي الثامنة والنصف.</p>",
"en": "<p>Your guide meets you at the hotel in the morning and we head north to the Black Sea coast. We start in Ağva, a village of thick forests and two rivers flowing into the sea, with a boat tour on the Hidden Lake surrounded by quiet nature, then the clear waters of the Göksu River (swimming is possible in summer).</p><p>After lunch at a local restaurant we drive to Şile to see its historic lighthouse above the Black Sea and relax on one of its finest beaches. We return to Istanbul in the evening, reaching the hotel around 20:30.</p>",
"ru": "<p>Утром гид встречает вас в отеле, и мы едем на север, к Чёрному морю. Начинаем с Агвы — деревни среди густых лесов, где две реки впадают в море: прогулка на лодке по Скрытому озеру и кристально чистая река Гёксу (летом можно купаться).</p><p>После обеда в местном ресторане — Шиле: исторический маяк над Чёрным морем и отдых на одном из лучших пляжей. Вечером возвращение в Стамбул, в отеле около 20:30.</p>",
"de": "<p>Morgens holt Sie Ihr Reiseleiter im Hotel ab, und es geht nach Norden zur Schwarzmeerküste. In Ağva, einem Dorf zwischen dichten Wäldern und zwei Flüssen, machen wir eine Bootsfahrt auf dem Versteckten See und besuchen den klaren Fluss Göksu (im Sommer kann man baden).</p><p>Nach dem Mittagessen fahren wir nach Şile zum historischen Leuchtturm über dem Schwarzen Meer und entspannen an einem der schönsten Strände. Rückkehr ins Hotel gegen 20:30 Uhr.</p>",
"fr": "<p>Le matin, votre guide vous retrouve à l'hôtel et nous partons vers la côte de la mer Noire. À Ağva, village de forêts épaisses où deux rivières rejoignent la mer, promenade en bateau sur le Lac caché, puis la rivière Göksu aux eaux claires (baignade possible en été).</p><p>Après le déjeuner, direction Şile, son phare historique dominant la mer Noire et l'une de ses plus belles plages. Retour à l'hôtel vers 20 h 30.</p>",
"es": "<p>Por la mañana el guía le recoge en el hotel y partimos hacia la costa del mar Negro. En Ağva, un pueblo de bosques espesos donde dos ríos llegan al mar, hacemos un paseo en barco por el Lago Escondido y visitamos el río Göksu de aguas cristalinas (baño posible en verano).</p><p>Después del almuerzo vamos a Şile para ver su faro histórico sobre el mar Negro y descansar en una de sus mejores playas. Regreso al hotel hacia las 20:30.</p>"
},

"ar": "<p>يوم أخف لنستعيد النشاط بعد الرحلات الطويلة. ننطلق في الحادية عشرة في رحلة بحرية في البوسفور لمدة ساعتين بين قارتي آسيا وأوروبا، نمر خلالها بالقصور العثمانية والقلاع واليالي الخشبية الفاخرة على ضفتي المضيق وتحت جسوره الشهيرة.</p><p>نتوقف على الضفة الأوروبية لزيارة قصر دولما بهجة بقاعاته المذهّبة وثرياته الكريستالية، ثم نعبر إلى تلة تشامليجا لنرى إسطنبول كلها من أعلى نقطة فيها. ونختم اليوم بوقت حر للتسوق في مول إستينيا بارك قبل العودة إلى الفندق حوالي السادسة والنصف.</p>",
"en": "<p>A lighter day to recharge after the long excursions. At 11:00 we set off on a two-hour Bosphorus cruise between Asia and Europe, passing Ottoman palaces, fortresses and grand wooden waterside mansions on both shores, and sailing under the famous bridges.</p><p>We stop on the European shore to visit Dolmabahçe Palace with its gilded halls and crystal chandeliers, then cross to Çamlıca Hill to see the whole of Istanbul from its highest point. The day ends with free time for shopping at İstinyePark before returning to the hotel around 18:30.</p>",
"ru": "<p>Более лёгкий день для отдыха после дальних поездок. В 11:00 — двухчасовая прогулка по Босфору между Азией и Европой: османские дворцы, крепости и роскошные деревянные особняки-ялы на обоих берегах, проход под знаменитыми мостами.</p><p>Остановка на европейском берегу для посещения дворца Долмабахче с позолоченными залами и хрустальными люстрами, затем холм Чамлыджа — весь Стамбул с самой высокой точки. В завершение — свободное время для шопинга в İstinyePark и возвращение в отель около 18:30.</p>",
"de": "<p>Ein leichterer Tag zum Durchatmen. Um 11:00 Uhr beginnt eine zweistündige Bosporus-Fahrt zwischen Asien und Europa – vorbei an osmanischen Palästen, Festungen und prächtigen Holzvillen am Ufer und unter den berühmten Brücken hindurch.</p><p>Am europäischen Ufer besuchen wir den Dolmabahçe-Palast mit vergoldeten Sälen und Kristallleuchtern, dann geht es auf den Çamlıca-Hügel mit Blick über ganz Istanbul. Zum Abschluss freie Zeit zum Einkaufen im İstinyePark; Rückkehr gegen 18:30 Uhr.</p>",
"fr": "<p>Une journée plus légère pour récupérer. À 11 h, croisière de deux heures sur le Bosphore entre l'Asie et l'Europe, le long des palais ottomans, des forteresses et des somptueuses demeures en bois, sous les célèbres ponts.</p><p>Escale sur la rive européenne pour visiter le palais de Dolmabahçe, ses salons dorés et ses lustres de cristal, puis la colline de Çamlıca et sa vue sur tout Istanbul. Temps libre pour le shopping à İstinyePark, retour vers 18 h 30.</p>",
"es": "<p>Un día más ligero para descansar. A las 11:00, crucero de dos horas por el Bósforo entre Asia y Europa, junto a palacios otomanos, fortalezas y lujosas mansiones de madera, y bajo los famosos puentes.</p><p>Paramos en la orilla europea para visitar el palacio de Dolmabahçe, con sus salones dorados y lámparas de cristal, y subimos a la colina de Çamlıca para ver todo Estambul desde lo alto. Tiempo libre para compras en İstinyePark; regreso hacia las 18:30.</p>"
},

"ar": "<p>ننطلق في الثامنة صباحاً شرقاً نحو صبنجة، ونتوقف عند بحيرتها الواسعة المحاطة بالجبال والغابات. ثم نصعد إلى قرية ماشوكية المشهورة بشلالاتها وجداولها ومطاعمها المطلّة على المياه، مع خيار ركوب الدراجات الرباعية ATV أو زيارة حديقة المغامرات. وفي موسم الشتاء نصعد إلى جبل كارتبه للاستمتاع بالثلج.</p><p>نتناول الغداء في مطعم وسط الطبيعة الخضراء، ونترك وقتاً حراً للمشي والتصوير. وبدل العودة إلى إسطنبول نقضي الليلة في منتجع خمس نجوم على ضفاف بحيرة صبنجة، ويمكن عند الطلب استبداله بكوخ ريفي فاخر في ماشوكية.</p>",
"en": "<p>At 08:00 we drive east to Sapanca and stop at its wide lake framed by mountains and forest. We then climb to Maşukiye, a village known for its waterfalls, streams and waterside restaurants, with the option of an ATV ride or a visit to the adventure park. In winter we also go up Mount Kartepe to enjoy the snow.</p><p>Lunch is at a restaurant in the green countryside, followed by free time for walks and photos. Instead of returning to Istanbul, you spend the night at a 5-star resort on the shore of Lake Sapanca; on request this can be replaced by a luxury countryside cottage in Maşukiye.</p>",
"ru": "<p>В 08:00 выезжаем на восток к Сапандже и останавливаемся у большого озера среди гор и лесов. Затем поднимаемся в деревню Машукие, известную водопадами, ручьями и ресторанами у воды; по желанию — поездка на квадроциклах или парк приключений. Зимой также поднимаемся на гору Картепе к снегу.</p><p>Обед в ресторане среди зелени и свободное время для прогулок и фото. Ночь не в Стамбуле, а в курортном отеле 5 звёзд на берегу озера Сапанджа; по запросу — роскошный загородный коттедж в Машукие.</p>",
"de": "<p>Um 08:00 Uhr fahren wir nach Osten zum Sapanca-See inmitten von Bergen und Wäldern. Dann geht es hinauf nach Maşukiye, bekannt für Wasserfälle, Bäche und Restaurants am Wasser – wahlweise mit Quad-Tour oder Abenteuerpark. Im Winter fahren wir auch auf den Kartepe in den Schnee.</p><p>Mittagessen im Grünen und Zeit für Spaziergänge und Fotos. Übernachtung in einem 5-Sterne-Resort am Ufer des Sapanca-Sees; auf Wunsch stattdessen in einem luxuriösen Landhaus in Maşukiye.</p>",
"fr": "<p>À 8 h, route vers l'est jusqu'au lac de Sapanca, entouré de montagnes et de forêts. Nous montons ensuite au village de Maşukiye, réputé pour ses cascades, ses ruisseaux et ses restaurants au bord de l'eau, avec balade en quad ou parc aventure en option. En hiver, nous montons aussi au mont Kartepe pour la neige.</p><p>Déjeuner en pleine nature et temps libre pour marcher et photographier. Nuit dans un resort 5 étoiles au bord du lac de Sapanca ; sur demande, dans un chalet de campagne de luxe à Maşukiye.</p>",
"es": "<p>A las 08:00 viajamos al este hasta el lago de Sapanca, rodeado de montañas y bosques. Subimos después a Maşukiye, conocido por sus cascadas, arroyos y restaurantes junto al agua, con opción de quad o parque de aventuras. En invierno subimos también al monte Kartepe para disfrutar de la nieve.</p><p>Almuerzo en plena naturaleza y tiempo libre para pasear y hacer fotos. Noche en un resort de 5 estrellas a orillas del lago de Sapanca; a petición, en una cabaña rural de lujo en Maşukiye.</p>"
},

"ar": "<p>صباح هادئ في أحضان الطبيعة: نستكشف المحمية الجبلية القريبة مع ركوب الخيل والمشي أو الدراجات الجبلية، ونجلس لنزهة وشواء وسط الغابة، ونتسوق المنتجات الريفية العضوية مثل العسل والمكسرات.</p><p>في طريق العودة نزور إزميت ونتوقف عند نقطة مطلّة على الغابات الخضراء، مع وقت حر للاسترخاء وتسوق خفيف في الأسواق المحلية. وعلى الجانب الآسيوي من إسطنبول نزور أكواريوم فيابورت وحديقة الأسود، ثم نصل إلى الفندق حوالي الثامنة مساءً.</p>",
"en": "<p>A peaceful morning in nature: we explore the nearby mountain reserve with horse riding, hiking or mountain biking, settle in for a forest picnic and barbecue, and shop for organic country produce such as honey and nuts.</p><p>On the way back we visit İzmit and stop at a viewpoint over its green forests, with free time to relax and some light shopping at local markets. On Istanbul's Asian side we visit the Viaport Aquarium and Lion Park, reaching the hotel around 20:00.</p>",
"ru": "<p>Спокойное утро на природе: горный заповедник с верховой ездой, пешими прогулками или горными велосипедами, пикник и барбекю в лесу, покупка деревенских органических продуктов — мёда и орехов.</p><p>По дороге обратно — Измит и смотровая площадка над зелёными лесами, свободное время и лёгкий шопинг на местных рынках. На азиатской стороне Стамбула посещаем аквариум Viaport и Парк львов; в отеле около 20:00.</p>",
"de": "<p>Ein ruhiger Morgen in der Natur: Reiten, Wandern oder Mountainbiken im nahen Bergreservat, Picknick und Grillen im Wald und Einkauf von Bio-Produkten wie Honig und Nüssen.</p><p>Auf dem Rückweg besuchen wir İzmit mit einem Aussichtspunkt über die grünen Wälder und Zeit für kleine Einkäufe. Auf der asiatischen Seite Istanbuls folgen das Viaport-Aquarium und der Löwenpark; Ankunft im Hotel gegen 20:00 Uhr.</p>",
"fr": "<p>Une matinée paisible en pleine nature : équitation, randonnée ou VTT dans la réserve de montagne, pique-nique et barbecue en forêt, et achats de produits fermiers bio comme le miel et les fruits secs.</p><p>Au retour, arrêt à İzmit et à un belvédère sur ses forêts, temps libre et petits achats sur les marchés. Sur la rive asiatique d'Istanbul, visite de l'aquarium Viaport et du parc des lions ; arrivée à l'hôtel vers 20 h.</p>",
"es": "<p>Una mañana tranquila en la naturaleza: paseo a caballo, senderismo o bicicleta de montaña en la reserva cercana, pícnic y barbacoa en el bosque, y compra de productos rurales ecológicos como miel y frutos secos.</p><p>De regreso visitamos İzmit y un mirador sobre sus bosques, con tiempo libre y compras en mercados locales. En la orilla asiática de Estambul visitamos el acuario Viaport y el parque de leones; llegada al hotel hacia las 20:00.</p>"
},

"ar": "<p>ننطلق في الثامنة صباحاً ونعبر بحر مرمرة بالعبّارة نحو بورصة، أول عاصمة للدولة العثمانية. نزور الشجرة المعمّرة التي يزيد عمرها على ستة قرون، ثم نصعد بالتلفريك إلى جبل أولوداغ لنستمتع بإطلالات بانورامية على الغابات والمدينة، ونتناول غداء الشواء في الهواء الطلق وسط الطبيعة.</p><p>بعد الظهر نتجول في سوق الحرير التاريخي (كوزا هان)، ونزور شلالات بورصة، ونتوقف في محل للحلقوم والحلويات التركية لتذوقها وشرائها. نعود إلى إسطنبول مساءً ونصل إلى الفندق حوالي التاسعة والنصف. تذكرة التلفريك والشواء مشمولة.</p>",
"en": "<p>At 08:00 we cross the Sea of Marmara by ferry to Bursa, the first capital of the Ottoman state. We visit the ancient plane tree, more than six centuries old, then ride the cable car up Mount Uludağ for panoramic views over forests and city, with an open-air barbecue lunch in nature.</p><p>In the afternoon we stroll through the historic silk market (Koza Han), see the Bursa waterfalls and stop at a Turkish delight shop to taste and buy local sweets. We return to Istanbul in the evening, reaching the hotel around 21:30. The cable car ticket and barbecue are included.</p>",
"ru": "<p>В 08:00 на пароме через Мраморное море отправляемся в Бурсу — первую столицу Османского государства. Осматриваем платан возрастом более шести веков, поднимаемся по канатной дороге на гору Улудаг к панорамам лесов и города и обедаем барбекю на свежем воздухе.</p><p>Днём — исторический шёлковый рынок Коза-Хан, водопады Бурсы и лавка лукума с дегустацией. Вечером возвращение в Стамбул, в отеле около 21:30. Билет на канатную дорогу и барбекю включены.</p>",
"de": "<p>Um 08:00 Uhr überqueren wir mit der Fähre das Marmarameer nach Bursa, der ersten Hauptstadt des Osmanischen Reiches. Wir besuchen die über 600 Jahre alte Platane, fahren mit der Seilbahn auf den Uludağ und genießen ein Grill-Mittagessen im Freien.</p><p>Am Nachmittag bummeln wir über den historischen Seidenmarkt Koza Han, sehen die Wasserfälle von Bursa und probieren Lokum in einer Konditorei. Rückkehr ins Hotel gegen 21:30 Uhr. Seilbahnticket und Grillessen sind inklusive.</p>",
"fr": "<p>À 8 h, traversée de la mer de Marmara en ferry vers Bursa, première capitale ottomane. Visite du platane plus que six fois centenaire, puis téléphérique jusqu'au mont Uludağ pour les panoramas et déjeuner barbecue en plein air.</p><p>L'après-midi, flânerie au marché historique de la soie (Koza Han), cascades de Bursa et dégustation de loukoums. Retour à l'hôtel vers 21 h 30. Billet de téléphérique et barbecue inclus.</p>",
"es": "<p>A las 08:00 cruzamos el mar de Mármara en ferry hacia Bursa, primera capital del Estado otomano. Visitamos el plátano de más de seis siglos y subimos en teleférico al monte Uludağ para disfrutar de las vistas, con almuerzo de barbacoa al aire libre.</p><p>Por la tarde paseamos por el mercado histórico de la seda (Koza Han), vemos las cascadas de Bursa y probamos delicias turcas. Regreso al hotel hacia las 21:30. Teleférico y barbacoa incluidos.</p>"
},

"ar": "<p>يوم استرخاء بعد بورصة. ننطلق في الثامنة صباحاً ونعبر بحر مرمرة بالعبّارة مع السيارة نحو يالوفا، ونزور شلالاتها الجميلة وسط الغابة، وهي مكان مثالي لمحبي الطبيعة والتصوير.</p><p>نتجول في منتزه ترمال الأخضر، ثم وقت حر لتجربة الحمامات الكبريتية الحارة المعروفة بخصائصها العلاجية، مع أنشطة اختيارية مثل المشي الجبلي أو جولة السفاري. نتناول الغداء في مطعم محلي وسط الطبيعة، ونعود إلى الفندق حوالي الثامنة مساءً.</p>",
"en": "<p>A relaxing day after Bursa. At 08:00 we cross the Sea of Marmara by car ferry to Yalova and visit its beautiful forest waterfalls, perfect for nature lovers and photography.</p><p>We walk through the green Termal park, followed by free time to enjoy the hot sulphur baths known for their therapeutic properties, with optional mountain hiking or a safari ride. Lunch is at a local restaurant surrounded by nature, and we are back at the hotel around 20:00.</p>",
"ru": "<p>День отдыха после Бурсы. В 08:00 на автомобильном пароме через Мраморное море едем в Ялову и посещаем красивые лесные водопады — рай для любителей природы и фотографии.</p><p>Прогулка по зелёному парку Термал и свободное время для горячих серных ванн, известных своими целебными свойствами; по желанию — пешая прогулка в горы или сафари. Обед в местном ресторане на природе, возвращение в отель около 20:00.</p>",
"de": "<p>Ein Erholungstag nach Bursa. Um 08:00 Uhr bringt uns die Autofähre über das Marmarameer nach Yalova zu den schönen Waldwasserfällen – ideal für Naturfreunde und Fotografen.</p><p>Spaziergang durch den grünen Park von Termal und freie Zeit für die heißen Schwefelbäder mit heilender Wirkung; optional Bergwanderung oder Safari-Fahrt. Mittagessen in einem Restaurant im Grünen, Rückkehr gegen 20:00 Uhr.</p>",
"fr": "<p>Une journée détente après Bursa. À 8 h, ferry avec la voiture jusqu'à Yalova et ses belles cascades en forêt, idéales pour la nature et la photo.</p><p>Promenade dans le parc verdoyant de Termal, puis temps libre pour profiter des bains sulfureux chauds aux vertus thérapeutiques, avec randonnée ou safari en option. Déjeuner dans un restaurant en pleine nature, retour vers 20 h.</p>",
"es": "<p>Un día de relax después de Bursa. A las 08:00 cruzamos el mar de Mármara en ferry con el coche hasta Yalova y visitamos sus bonitas cascadas en el bosque, ideales para la naturaleza y la fotografía.</p><p>Paseo por el verde parque de Termal y tiempo libre para los baños termales de azufre, conocidos por sus propiedades curativas, con senderismo o safari opcionales. Almuerzo en un restaurante en plena naturaleza; regreso hacia las 20:00.</p>"
},

"ar": "<p>ننطلق في الثامنة صباحاً نحو الأناضول، ونتوقف في سوغوت لزيارة ضريح أرطغرل غازي، والد مؤسس الدولة العثمانية عثمان الأول. ثم نكمل إلى إسكي شهير، المدينة الحديثة النابضة بالحياة، ونتمشى في حي أودون بازاري ببيوته العثمانية الملوّنة.</p><p>نركب القارب في نهر بورسوك الذي يعبر المدينة، ونزور متحف الشمع بتماثيله الواقعية، ثم حديقة سازوفا بقلعتها الخيالية وسفينة القراصنة، مع وقت لشراء الهدايا من الأسواق المحلية. الغداء مشمول، ونعود إلى إسطنبول ليلاً حوالي التاسعة والنصف.</p>",
"en": "<p>At 08:00 we head into Anatolia and stop in Söğüt to visit the tomb of Ertuğrul Gazi, father of Osman I, founder of the Ottoman state. We continue to Eskişehir, a lively modern city, and walk through Odunpazarı with its colourful Ottoman houses.</p><p>We take a boat ride on the Porsuk River through the city centre, visit the Wax Museum with its lifelike figures, and explore Sazova Park with its fairy-tale castle and pirate ship, with time for souvenirs at local bazaars. Lunch is included, and we are back in Istanbul around 21:30.</p>",
"ru": "<p>В 08:00 отправляемся в Анатолию; остановка в Сёгюте у гробницы Эртугрула Гази, отца Османа I — основателя Османского государства. Далее Эскишехир, живой современный город, и прогулка по кварталу Одунпазары с цветными османскими домами.</p><p>Прогулка на лодке по реке Порсук через центр, музей восковых фигур и парк Сазова со сказочным замком и пиратским кораблём, время для сувениров на местных базарах. Обед включён, возвращение в Стамбул около 21:30.</p>",
"de": "<p>Um 08:00 Uhr geht es nach Anatolien. In Söğüt besuchen wir das Grab von Ertuğrul Gazi, dem Vater von Osman I., Gründer des Osmanischen Reiches. Weiter nach Eskişehir, eine lebendige moderne Stadt, und Spaziergang durch Odunpazarı mit seinen bunten osmanischen Häusern.</p><p>Bootsfahrt auf dem Porsuk durch das Zentrum, Wachsfigurenkabinett und Sazova-Park mit Märchenschloss und Piratenschiff, dazu Zeit für Souvenirs. Mittagessen inklusive, Rückkehr nach Istanbul gegen 21:30 Uhr.</p>",
"fr": "<p>À 8 h, départ vers l'Anatolie avec un arrêt à Söğüt au tombeau d'Ertuğrul Gazi, père d'Osman Ier, fondateur de l'État ottoman. Puis Eskişehir, ville moderne et animée, et promenade dans Odunpazarı et ses maisons ottomanes colorées.</p><p>Balade en bateau sur la rivière Porsuk, musée de cire et parc de Sazova avec son château de conte de fées et son bateau pirate, temps pour les souvenirs. Déjeuner inclus, retour à Istanbul vers 21 h 30.</p>",

/* ================= PHOTOS (Wikimedia Commons, loaded on demand) ================= */
const imgCache={};
try{ Object.assign(imgCache, JSON.parse(localStorage.getItem("ft-tr-img")||"{}")); }catch(e){}
async function findImage(q){
  if(imgCache[q]) return imgCache[q];
  const url="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=1400&gsrsearch="+encodeURIComponent(q+" filetype:bitmap");
  const r=await fetch(url); const j=await r.json();
  const pages=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index);
  const cands=pages.map(p=>p.imageinfo&&p.imageinfo[0]).filter(ii=>ii&&/jpeg|png/.test(ii.mime)&&ii.width>=700);
  const pick=cands.find(ii=>ii.width>ii.height)||cands[0];
  if(!pick) return null;
  const res={thumb:pick.thumburl, full:pick.thumburl, page:pick.descriptionurl};
  imgCache[q]=res; try{localStorage.setItem("ft-tr-img",JSON.stringify(imgCache));}catch(e){}
  return res;
}
async function findImages(qs,must,n){
  const key="H:"+qs.join("|");
  if(imgCache[key]) return imgCache[key];
  const out=[], seen=new Set();
  for(const q of qs){
    if(out.length>=n) break;
    try{
      const url="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=40&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=1400&gsrsearch="+encodeURIComponent(q+" filetype:bitmap");
      const j=await (await fetch(url)).json();
      Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index).forEach(p=>{
        const ii=p.imageinfo&&p.imageinfo[0]; if(!ii||out.length>=n||seen.has(p.title)) return;
        if(!/jpeg|png/.test(ii.mime)||ii.width<600) return;
        const t=p.title.toLowerCase(); if(!must.some(m=>t.includes(m))) return;
        seen.add(p.title); out.push(ii.thumburl);
      });
    }catch(e){}
  }
  imgCache[key]=out; try{localStorage.setItem("ft-tr-img",JSON.stringify(imgCache));}catch(e){}
  return out;
}
async function loadHotelImages(i){
  const h=HOTELS[i]; const box=daysEl.querySelector(`.hgal[data-hd="${i}"]`); if(!h||!box||box.dataset.done) return; box.dataset.done=1;
  const urls=(h.imgs&&h.imgs.length?h.imgs:await findImages(h.q,h.must,8)).slice(0,8);
  let left=urls.length;
  box.querySelectorAll(".ph").forEach((el,k)=>{
    if(!urls[k]){ el.remove(); return; }
    const img=new Image(); img.loading="lazy"; img.alt=h.name; img.src=urls[k];
    img.onload=()=>el.classList.remove("loading");
    img.onerror=()=>{ el.remove(); if(--left===0 && h.imgs && h.imgs.length){ box.dataset.done=""; box.innerHTML=Array.from({length:8},(_,k)=>`<button class="ph loading" data-h="${i}" data-k="${k}" aria-label="${h.name}"></button>`).join(""); const keep=h.imgs; h.imgs=[]; loadHotelImages(i).finally(()=>{h.imgs=keep;}); } };
    img.referrerPolicy="no-referrer";
    el.prepend(img); el.dataset.src=urls[k];
  });
  if(!urls.length) box.outerHTML=`<p class="hgal-empty">${T[lang].nophotos}</p>`;
}
function loadDayImages(i){
  daysEl.querySelectorAll(`.ph[data-d="${i}"]`).forEach(async el=>{
    if(el.dataset.done) return; el.dataset.done=1;
    const s=DAYS[i].stops[+el.dataset.s];
    try{
      let im=s.img?{thumb:s.img,full:s.img}:null;
      if(!im) for(const q of [s.q,...(s.alt||[])]){ try{ im=await findImage(q); }catch(e){ im=null; } if(im) break; }
      if(!im) throw 0;
      const img=new Image(); img.loading="lazy"; img.alt=s[lang]; img.src=im.thumb;
      img.onload=()=>el.classList.remove("loading");
      img.onerror=()=>{el.classList.remove("loading");el.classList.add("noimg");};
      el.prepend(img); el.dataset.src=im.full;
    }catch(err){ el.classList.remove("loading"); el.classList.add("noimg"); }
  });
}
// hero background
findImage("Bosphorus Bridge Istanbul skyline").then(im=>{ if(im) $("#heroImg").style.backgroundImage=`url("${im.thumb}")`; }).catch(()=>{});

/* ================= LIGHTBOX ================= */
const lb=$("#lb"); let cur=null;
function flat(){ return [...daysEl.querySelectorAll(".day.open .ph[data-src]")]; }
function capOf(el){
  if(el.dataset.h!==undefined){ const i=+el.dataset.h; return `${T[lang].dayW} ${i+1} · ${HOTELS[i].name} (${HOTELS[i].stars}★)`; }
  const d=+el.dataset.d, s=+el.dataset.s; return `${T[lang].dayW} ${d+1} · ${DAYS[d].stops[s][lang]}`;
}
function openLB(el){
  if(!el||!el.dataset.src) return;
  cur=el;
  $("#lb-img").src=el.dataset.src; $("#lb-img").alt=capOf(el);
  $("#lb-cap").innerHTML=`${capOf(el)}<small>${el.dataset.h!==undefined&&HOTELS[+el.dataset.h].imgs.length?T[lang].photoH:T[lang].photo}</small>`;
  lb.hidden=false; document.body.style.overflow="hidden"; $("#lb-close").focus();
}
function closeLB(){ lb.hidden=true; document.body.style.overflow=""; }
function step(n){ const a=flat(); if(!a.length) return; let k=a.indexOf(cur); k=(k+n+a.length)%a.length; openLB(a[k]); }
$("#lb-close").onclick=closeLB;
$("#lb-prev").onclick=()=>step(lang==="ar"?1:-1);
$("#lb-next").onclick=()=>step(lang==="ar"?-1:1);
lb.addEventListener("click",e=>{ if(e.target===lb) closeLB(); });
document.addEventListener("keydown",e=>{ if(lb.hidden) return; if(e.key==="Escape") closeLB(); if(e.key==="ArrowRight") step(lang==="ar"?-1:1); if(e.key==="ArrowLeft") step(lang==="ar"?1:-1); });

/* ================= LANGUAGE ================= */
$("#langSel").addEventListener("change",e=>{
  lang=e.target.value; try{localStorage.setItem("ft-tr-lang",lang);}catch(err){}
  renderStatic(); renderDays();
});

/* ================= FORM (Web3Forms) ================= */
$("#form").addEventListener("submit",async e=>{
  e.preventDefault();
  const t=T[lang], msg=$("#f-msg"), btn=$("#f-btn");
  const name=$("#f-name").value.trim(), email=$("#f-email").value.trim(), wa=$("#f-wa").value.trim();
  msg.className="msg";
  if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||wa.replace(/\D/g,"").length<8){ msg.textContent=t.err; msg.classList.add("err"); return; }
  if(WEB3FORMS_KEY.startsWith("YOUR_")){ msg.textContent=t.nokey; msg.classList.add("err"); return; }
  btn.disabled=true; btn.textContent=t.sending;
  try{
    const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:"Turkey 11-Day Tour — New interest ("+lang.toUpperCase()+")",from_name:"Fable Tour Website",
        name,email,whatsapp:wa,tour:"Turkey 11 days / 10 nights (starts Fridays in Istanbul)",language:lang,botcheck:e.target.botcheck.checked})});
    const j=await r.json();
    if(!j.success) throw 0;
    msg.textContent=t.ok; msg.classList.add("ok"); e.target.reset();
  }catch(err){ msg.textContent=t.fail; msg.classList.add("err"); }
  btn.disabled=false; btn.textContent=t.send;
});

/* ================= INIT ================= */
renderStatic(); renderDays();
// open day 1 by default so the page shows content at first glance
daysEl.querySelector(".day-btn").click();
</script>
</body>
